<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo escuro idêntico ao site (#04060d) -->
  <rect width="512" height="512" rx="90" fill="#04060d" stroke="#d4a017" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Colchetes Dourados [ ] -->
  <text x="75" y="325" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="200" fill="#d4a017" text-anchor="middle">[</text>
  <text x="437" y="325" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="200" fill="#d4a017" text-anchor="middle">]</text>
  
  <!-- Texto KRC Central -->
  <text x="256" y="320" font-family="'JetBrains Mono', 'Syne', monospace" font-weight="800" font-size="140" fill="#ffffff" text-anchor="middle" letter-spacing="4">KRC</text>
</svg>
