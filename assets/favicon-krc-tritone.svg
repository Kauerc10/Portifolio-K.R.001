<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo escuro idêntico ao site (#04060d) -->
  <rect width="512" height="512" rx="90" fill="#04060d" />
  
  <g transform="translate(0, 10)">
    <!-- Letra K em Branco (Hero style) -->
    <text x="120" y="320" font-family="'Syne', 'Inter', sans-serif" font-weight="800" font-size="190" fill="#ffffff" text-anchor="middle">K</text>
    
    <!-- Letra R em Dourado (#d4a017) -->
    <text x="256" y="320" font-family="'Syne', 'Inter', sans-serif" font-weight="800" font-size="190" fill="#d4a017" text-anchor="middle">R</text>
    
    <!-- Letra C em Outline (Contorno) -->
    <text x="392" y="320" font-family="'Syne', 'Inter', sans-serif" font-weight="800" font-size="190" fill="none" stroke="#ffffff" stroke-width="12" text-anchor="middle">C</text>
  </g>
</svg>
