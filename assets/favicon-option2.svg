<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d4a017" />
    </linearGradient>
  </defs>
  <!-- Background Fundo -->
  <rect width="512" height="512" rx="90" fill="#04060d" />
  
  <!-- Pinos do Chip (Topo, Baixo, Esquerda, Direita) -->
  <g fill="#d4a017" opacity="0.7">
    <rect x="140" y="25" width="24" height="45" rx="6" />
    <rect x="244" y="25" width="24" height="45" rx="6" />
    <rect x="348" y="25" width="24" height="45" rx="6" />
    
    <rect x="140" y="442" width="24" height="45" rx="6" />
    <rect x="244" y="442" width="24" height="45" rx="6" />
    <rect x="348" y="442" width="24" height="45" rx="6" />
    
    <rect x="25" y="140" width="45" height="24" rx="6" />
    <rect x="25" y="244" width="45" height="24" rx="6" />
    <rect x="25" y="348" width="45" height="24" rx="6" />
    
    <rect x="442" y="140" width="45" height="24" rx="6" />
    <rect x="442" y="244" width="45" height="24" rx="6" />
    <rect x="442" y="348" width="45" height="24" rx="6" />
  </g>

  <!-- Corpo do Chip -->
  <rect x="80" y="80" width="352" height="352" rx="40" fill="#0d1322" stroke="url(#chipGold)" stroke-width="8" />

  <!-- Texto KR Monograma -->
  <text x="256" y="295" font-family="'JetBrains Mono', 'Syne', sans-serif" font-weight="800" font-size="160" fill="url(#chipGold)" text-anchor="middle" letter-spacing="-5">KR</text>
  
  <!-- Circuit Nodes -->
  <circle cx="120" cy="120" r="10" fill="#2563eb" />
  <circle cx="392" cy="120" r="10" fill="#2563eb" />
  <circle cx="120" cy="392" r="10" fill="#2563eb" />
  <circle cx="392" cy="392" r="10" fill="#d4a017" />
</svg>
