name: Portfolio CI/CD Pipeline

on:
  push:
    branches: [main, dev, 'feat/*']
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Run Vitest Unit & Integration Tests
        run: npm run test

      - name: 🚀 Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
