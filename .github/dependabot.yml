version: 2
updates:
  # Mantém atualizados os pacotes npm (Next.js, React, Three.js, Vercel AI SDK)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automerge"

  # Mantém atualizadas as ações do GitHub Actions (.github/workflows/ci.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
